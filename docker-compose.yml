# Local development services. Start with: docker compose up -d
# The credentials below are for local development only.
services:
  postgres:
    image: postgres:18-alpine
    container_name: pulsealert-postgres
    environment:
      POSTGRES_DB: pulsealert
      POSTGRES_USER: pulsealert
      POSTGRES_PASSWORD: pulsealert
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pulsealert -d pulsealert"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
